# ============================================================
# Openworld VPS 自动续期 — GitHub Actions 工作流
# ============================================================

name: Openworld VPS 自动续期

on:
  schedule:
    # 每天 02:23 UTC（北京时间 10:23）自动执行
    - cron: '23 2 * * *'
  workflow_dispatch: {}    # 支持手动触发

permissions:
  contents: read

jobs:
  renew:
    name: 续期
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests numpy opencv-python-headless

      - name: 安装 Chromium（含系统依赖）
        run: playwright install --with-deps chromium

      - name: 运行续期脚本
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT_TOKEN:  ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:    ${{ secrets.TG_CHAT_ID }}
          ACCOUNT_NAME:  GitHub Actions
        run: python apprenew.py

      - name: 上传截图（失败也保留，方便排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
